; Truly Nordic Skyforged Armor and Weapons - the no-ESP option (needs SkyPatcher, Nexus 106659).
;
; SkyPatcher edits records that already exist; it cannot create one. The plugin version ADDS the
; Skyforge Steel armour set, mace, warhammer, bow and arrows and their Skyforge recipes - new records,
; so none of that is in this option. What it can do is give vanilla's five Skyforge Steel weapons
; (sword, dagger, greatsword, battleaxe, war axe - Eorlund's weapons, Skyrim.esm) our models, which is
; all the plugin changes on them. Vanilla's Skyforge weapons share the STEEL weapons' mesh files, so a
; loose-file replacement is not possible without changing every steel weapon; this sets the model path
; on these five records only.

filterByWeapons=Skyrim.esm|09F25C:model=NordicSkyforge\weapons\Sword.nif
filterByWeapons=Skyrim.esm|09F25D:model=NordicSkyforge\weapons\Dagger.nif
filterByWeapons=Skyrim.esm|09F25E:model=NordicSkyforge\weapons\Greatsword.nif
filterByWeapons=Skyrim.esm|09F25F:model=NordicSkyforge\weapons\BattleAxe.nif
filterByWeapons=Skyrim.esm|09F260:model=NordicSkyforge\weapons\Axe.nif

; First person: the plugin points each weapon at a first-person model record of its own (a STAT it adds).
; SkyPatcher can only point modelFirstPerson at an existing record, and vanilla's are the steel ones.
; Clearing it makes the game draw the world model in first person instead, as it does for any weapon
; without a first-person record. `null` on this key is the documented convention for clearing a form
; field, but it is not listed for this key specifically - the in-game check confirms it. If it does not
; apply, first person shows vanilla steel. Kept on its own lines so a skipped key leaves the models above.
filterByWeapons=Skyrim.esm|09F25C,Skyrim.esm|09F25D,Skyrim.esm|09F25E,Skyrim.esm|09F25F,Skyrim.esm|09F260:modelFirstPerson=null
